name: Update blog manifest

# Runs automatically whenever anything in Blogs/ changes on this branch —
# including files added through the GitHub website's "Add file > Upload
# files" button, since that creates a commit too. Regenerates
# Blogs/manifest.json + Blogs/manifest.js and commits the result back,
# so a new post shows up on the live site with zero manual steps.

on:
  push:
    paths:
      - 'Blogs/**'
  workflow_dispatch:   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write       # needed so the Action can commit the updated manifest back

jobs:
  regenerate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate Blogs/manifest.json
        run: node generate-manifest.js

      - name: Commit manifest if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Blogs/manifest.json Blogs/manifest.js
          git diff --staged --quiet || git commit -m "chore: regenerate blog manifest"
          git push
